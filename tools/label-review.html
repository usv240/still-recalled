<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label review</title>
<style>
  :root { --ink: #161616; --muted: #5d5d5d; --rule: #e4e4e4; --ground: #f6f6f6; --red: #b42318; --amber: #8a5a00; --green: #1f6f3f; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #fff; color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--rule); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  select, button { font: inherit; font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 64px; }
  .row { display: grid; grid-template-columns: 168px 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .row img { width: 168px; height: 168px; object-fit: contain; background: var(--ground); border-radius: 6px; }
  .title { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .meta { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .label { font-size: 13px; line-height: 1.5; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-right: 6px; }
  .yes { background: #fde8e6; color: var(--red); } .maybe { background: #fff1d6; color: var(--amber); } .no { background: #e6f2ea; color: var(--green); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choices button { padding: 6px 12px; border: 1px solid #cfcfcf; border-radius: 6px; background: #fff; cursor: pointer; }
  .choices button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .row.done { opacity: .55; }
  a { color: inherit; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .row img { width: 100%; height: 220px; } }
</style>
</head>
<body>
<header>
  <h1>Label review</h1>
  <label>Set <select id="set"><option value="eval">First test (136)</option><option value="fresh">Second test (125)</option><option value="third">Third test (176)</option><option value="fourth">Fourth test (160)</option></select></label>
  <p id="progress"></p>
  <p>For each listing: is the AI's label right, judging only from the title and photo? Answers save as you click.</p>
</header>
<main id="list"></main>
<script type="module" src="label-review.js"></script>
</body>
</html>
